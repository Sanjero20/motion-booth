services:
  db:
    image: postgres:16
    container_name: motionbooth-db
    environment:
      POSTGRES_USER: motionbooth
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: motionbooth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: